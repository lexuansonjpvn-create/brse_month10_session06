<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <link rel="stylesheet" href="./ex5.css">
</head>
<body>

    <div class="landing-page">
        <!-- Thanh điều hướng -->
        <header class="navbar">
            <a href="#" class="logo">MyLogo</a>
            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#services">Services</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <!-- Phần giới thiệu trung tâm (Hero) -->
        <section class="hero" id="home">
            <h1 class="hero-title">Welcome to My Website</h1>
            <p class="hero-subtitle">We provide the best solutions for your business.</p>
            <a href="#services" class="cta-btn">Get Started</a>
        </section>

        <!-- Danh sách 3 tính năng (Features) -->
        <section class="features" id="services">
            <div class="feature-card">Feature 1</div>
            <div class="feature-card">Feature 2</div>
            <div class="feature-card">Feature 3</div>
        </section>

        <!-- Chân trang (Footer) -->
        <footer class="footer" id="contact">
            <p>Contact us: <a href="mailto:email@example.com">email@example.com</a></p>
        </footer>
    </div>

</body>
</html>
